name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        run: npm ci

      - name: Test and build
        id: check
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        run: npm run check

      - name: Deploy Worker assets
        id: deploy
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

      - name: Report deployment result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const enabled = process.env.DEPLOY_ENABLED === 'true';
            const checkOutcome = process.env.CHECK_OUTCOME || 'skipped';
            const deployOutcome = process.env.DEPLOY_OUTCOME || 'skipped';
            const sha = process.env.DEPLOY_SHA;
            const runId = process.env.DEPLOY_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            let status;
            if (!enabled) {
              status = '⏸️ Production deployment devre dışı (`CLOUDFLARE_DEPLOY_ENABLED` değeri `true` değil).';
            } else if (checkOutcome === 'success' && deployOutcome === 'success') {
              status = '✅ Cloudflare production deployment başarılı.';
            } else {
              status = `❌ Cloudflare production deployment başarısız. Test/build: **${checkOutcome}**, deploy: **${deployOutcome}**.`;
            }

            const body = [
              status,
              '',
              `- Commit: \`${sha}\``,
              `- Workflow: ${runUrl}`,
              `- UTC zamanı: ${new Date().toISOString()}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body
            });
