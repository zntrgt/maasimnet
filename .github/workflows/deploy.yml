name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["Test and build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download verified production artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: maasimnet-dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and verify manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm ci && npm run check

      - name: Prepare IndexNow verification file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "::warning::INDEXNOW_KEY tanımlı değil; IndexNow doğrulama dosyası oluşturulmadı."
            exit 0
          fi

          if ! [[ "$INDEXNOW_KEY" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo "::error::INDEXNOW_KEY biçimi geçersiz."
            exit 1
          fi

          printf '%s' "$INDEXNOW_KEY" > "dist/${INDEXNOW_KEY}.txt"
          test "$(cat "dist/${INDEXNOW_KEY}.txt")" = "$INDEXNOW_KEY"
          echo "IndexNow doğrulama dosyası deploy çıktısına eklendi."

      - name: Deploy Worker assets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

      - name: Production smoke test
        id: smoke
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          wait_for_200() {
            local url="$1"
            local attempts=18
            local delay=5
            local status="000"

            for attempt in $(seq 1 "$attempts"); do
              status=$(curl \
                --connect-timeout 10 \
                --max-time 20 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                -sS -o /dev/null -w "%{http_code}" \
                "${url}?deploy_check=${DEPLOY_SHA}-${attempt}" || true)

              if [ "$status" = "200" ]; then
                echo "Smoke test başarılı: $url -> 200 (deneme $attempt/$attempts)"
                return 0
              fi

              echo "Henüz hazır değil: $url -> $status (deneme $attempt/$attempts)"
              sleep "$delay"
            done

            echo "Smoke test başarısız: $url son durum $status"
            return 1
          }

          mapfile -t smoke_urls < <(node scripts/production-smoke-urls.js)
          test "${#smoke_urls[@]}" -ge 4 || { echo "Manifestten yeterli smoke URL üretilemedi"; exit 1; }

          for url in "${smoke_urls[@]}"; do
            wait_for_200 "$url"
          done

      - name: Production cache and security header smoke test
        id: headers
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          response_headers() {
            local url="$1"
            curl \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -sS -D - -o /dev/null \
              "${url}?header_check=${DEPLOY_SHA}"
          }

          header_value() {
            local headers="$1"
            local name="$2"
            printf '%s\n' "$headers" \
              | tr -d '\r' \
              | awk -F': ' -v wanted="$name" 'tolower($1) == tolower(wanted) { value=$0; sub(/^[^:]+:[[:space:]]*/, "", value); found=value } END { print found }'
          }

          assert_response() {
            local url="$1"
            local expected_status="$2"
            local expected_cache="$3"
            local headers status cache cdn cf_cache xcto

            headers="$(response_headers "$url")"
            status="$(printf '%s\n' "$headers" | tr -d '\r' | awk '/^HTTP\// { code=$2 } END { print code }')"
            cache="$(header_value "$headers" 'cache-control')"
            cdn="$(header_value "$headers" 'cdn-cache-control')"
            cf_cache="$(header_value "$headers" 'cf-cache-status')"
            xcto="$(header_value "$headers" 'x-content-type-options')"

            test "$status" = "$expected_status" || {
              echo "::error::$url HTTP $status; beklenen $expected_status"
              return 1
            }

            [[ "$cache" == *"$expected_cache"* ]] || {
              echo "::error::$url cache-control '$cache'; beklenen parça '$expected_cache'"
              return 1
            }

            test "$xcto" = "nosniff" || {
              echo "::error::$url x-content-type-options '$xcto'; beklenen nosniff"
              return 1
            }

            # CDN-Cache-Control edge cache girdisidir ve Cloudflare bunu istemciye
            # geri yansıtmayabilir. Canlı testte zorunlu tutmuyor, yalnız teşhis için logluyoruz.
            echo "Header smoke başarılı: $url -> HTTP $status; cache='$cache'; cdn='${cdn:-<not-exposed>}'; cf-cache='${cf_cache:-<none>}'"
          }

          assert_response 'https://maasim.net/' '200' 'max-age=0'
          assert_response 'https://maasim.net/assets/app.js' '200' 'max-age=86400'
          assert_response 'https://maasim.net/assets/sirket-destekli-spor-wellness-editorial.webp' '200' 'max-age=2592000'
          assert_response 'https://maasim.net/sitemap.xml' '200' 'max-age=3600'
          assert_response 'https://maasim.net/api/contact' '405' 'no-store'

      - name: Submit sitemap URLs to IndexNow
        id: indexnow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/submit-indexnow.js

      - name: Report deployment result
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          HEADER_OUTCOME: ${{ steps.headers.outcome }}
          INDEXNOW_OUTCOME: ${{ steps.indexnow.outcome }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const deployOutcome = process.env.DEPLOY_OUTCOME || 'skipped';
            const smokeOutcome = process.env.SMOKE_OUTCOME || 'skipped';
            const headerOutcome = process.env.HEADER_OUTCOME || 'skipped';
            const indexNowOutcome = process.env.INDEXNOW_OUTCOME || 'skipped';
            const sha = process.env.DEPLOY_SHA;
            const runId = process.env.DEPLOY_RUN_ID;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const success = deployOutcome === 'success' && smokeOutcome === 'success' && headerOutcome === 'success';
            const status = success
              ? '✅ Cloudflare production deployment, canlı smoke ve cache/header kontrolleri başarılı.'
              : `❌ Production doğrulaması başarısız. Deploy: **${deployOutcome}**, smoke: **${smokeOutcome}**, headers: **${headerOutcome}**.`;

            const body = [
              status,
              '',
              `- Commit: \`${sha}\``,
              `- Cache/header smoke: **${headerOutcome}**`,
              `- IndexNow: **${indexNowOutcome}**`,
              `- Workflow: ${runUrl}`,
              `- UTC zamanı: ${new Date().toISOString()}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body
            });
