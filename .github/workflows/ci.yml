name: Test and build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test, build, verify and smoke test
        run: npm run check

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: maasimnet-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
