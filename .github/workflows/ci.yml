name: Test and build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify workflow scripts
        run: npm run verify:workflow

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify distribution
        run: npm run verify:dist

      - name: Verify blog manifest
        run: npm run verify:manifest

      - name: Verify SEO GEO blog quality
        run: npm run verify:quality

      - name: Smoke test generated output
        run: npm run smoke

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: maasimnet-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
