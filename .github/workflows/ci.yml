name: Test and build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify workflow scripts
        run: npm run verify:workflow

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify distribution
        run: npm run verify:dist

      - name: Verify centralized content dates
        run: npm run verify:content-dates

      - name: Verify Search, AI visibility and GA4 dashboard contract
        run: npm run verify:growth-dashboard

      - name: Verify blog manifest
        run: npm run verify:manifest

      - name: Verify SEO GEO blog quality v2
        run: npm run verify:quality

      - name: Verify editorial authority entities
        run: npm run verify:editorial-authority

      - name: Verify semantic topic clusters
        run: npm run verify:topic-clusters

      - name: Verify sitewide meta descriptions
        run: npm run verify:meta

      - name: Verify proprietary blog data
        run: npm run verify:proprietary-data

      - name: Verify termination calculators
        run: npm run verify:termination-calculators

      - name: Verify unemployment benefit calculator
        run: npm run verify:unemployment-calculator

      - name: Verify overtime calculator
        run: npm run verify:overtime-calculator

      - name: Verify annual leave pay calculator
        run: npm run verify:annual-leave-calculator

      - name: Verify minimum wage calculator
        run: npm run verify:minimum-wage-calculator

      - name: Verify calculator discovery and SEO internal linking
        run: npm run verify:calculator-discovery

      - name: Verify sitewide layout safety
        run: npm run verify:layout

      - name: Smoke test generated output
        run: npm run smoke

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: maasimnet-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
