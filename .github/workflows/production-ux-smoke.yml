name: Production UX smoke

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-ux:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live humanized calculator UX
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          fetch_live() {
            local url="$1"
            local separator='?'
            [[ "$url" == *'?'* ]] && separator='&'
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${url}${separator}ux_smoke=${DEPLOY_SHA}"
          }

          home="$(fetch_live 'https://maasim.net/')"
          termination="$(fetch_live 'https://maasim.net/tazminat-hesaplama/')"
          historical_2025="$(fetch_live 'https://maasim.net/2025-maas-hesaplama/')"
          humanized_js="$(fetch_live 'https://maasim.net/assets/humanized-ux.js?v=3')"
          historical_css="$(fetch_live 'https://maasim.net/assets/historical-payroll-calculator.css?v=2')"

          assert_contains() {
            local body="$1"
            local token="$2"
            local label="$3"
            if ! grep -Fq "$token" <<< "$body"; then
              echo "::error::Canlı UX doğrulaması başarısız: $label eksik ($token)"
              exit 1
            fi
            echo "Canlı UX doğrulandı: $label"
          }

          assert_not_contains() {
            local body="$1"
            local token="$2"
            local label="$3"
            if grep -Fq "$token" <<< "$body"; then
              echo "::error::Canlı UX doğrulaması başarısız: $label beklenmeyen içerik taşıyor ($token)"
              exit 1
            fi
            echo "Canlı UX doğrulandı: $label"
          }

          assert_contains "$home" '<h1>Maaşını hesapla</h1>' 'ana H1'
          assert_contains "$home" 'Henüz hesap yapmadın' 'ana empty state'
          assert_contains "$home" 'Net maaşımı gör' 'ana sonuç CTA'
          assert_contains "$home" 'onclick="calculateAndShowPayroll()"' 'orijinal hesapla ve sonucu göster aksiyonu'
          assert_contains "$home" 'humanized-ux.js?v=3' 'cache-busted humanized JS'
          assert_not_contains "$home" 'class="human-quick-amounts"' 'hazır tutarlar statik ve listenersız render edilmiyor'
          assert_contains "$humanized_js" 'function ensureQuickAmounts()' 'hazır tutar component üreticisi'
          assert_contains "$humanized_js" "quick.addEventListener('click'" 'hazır tutar click listener'
          assert_contains "$humanized_js" "input.dispatchEvent(new Event('input', { bubbles: true }))" 'hazır tutar input event akışı'
          assert_contains "$humanized_js" "typeof window.calculateAndShowPayroll === 'function'" 'mobil CTA gerçek hesaplama fonksiyonuna bağlı'
          assert_contains "$humanized_js" 'window.calculateAndShowPayroll();' 'mobil CTA gerçek hesaplamayı çağırıyor'
          assert_contains "$humanized_js" "qs('#input-salary')?.blur();" 'mobil hesaplama öncesi klavye kapanıyor'
          assert_not_contains "$humanized_js" "primary.removeAttribute('onclick')" 'humanized katman orijinal hesaplama aksiyonunu silmiyor'

          assert_contains "$termination" '<h1>Tazminatını hesapla</h1>' 'tazminat H1'
          assert_contains "$termination" 'Toplam tazminatımı gör' 'tazminat CTA'
          assert_contains "$termination" 'Düzenli yan hakların var mı?' 'tazminat progressive disclosure'

          assert_contains "$historical_2025" 'historical-payroll-calculator.css?v=2' '2025 tarihsel font stylesheet sürümü'
          assert_contains "$historical_css" 'font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' 'tarihsel ortak Inter font stack'
          assert_contains "$historical_css" 'font-variant-numeric:tabular-nums lining-nums' 'tarihsel sayısal tipografi'

          echo 'Production markup smoke başarılı.'

      - name: Verify live calculation in Chromium
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          npm exec --yes --package=playwright@1.55.0 -- playwright install chromium
          npm exec --yes --package=playwright@1.55.0 -- node <<'NODE'
          const { chromium } = require('playwright');

          const deploySha = process.env.DEPLOY_SHA || Date.now().toString();
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 430, height: 932 } });
          const consoleErrors = [];
          page.on('pageerror', (error) => consoleErrors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(`console: ${message.text()}`);
          });

          await page.goto(`https://maasim.net/?ux_e2e=${encodeURIComponent(deploySha)}`, {
            waitUntil: 'networkidle',
            timeout: 45000
          });

          const input = page.locator('#input-salary');
          await input.waitFor({ state: 'visible' });

          const widthBeforeFocus = await page.evaluate(() => ({
            inner: window.innerWidth,
            client: document.documentElement.clientWidth,
            scroll: document.documentElement.scrollWidth,
            scale: window.visualViewport?.scale ?? 1
          }));

          await input.click();
          const widthAfterFocus = await page.evaluate(() => ({
            inner: window.innerWidth,
            client: document.documentElement.clientWidth,
            scroll: document.documentElement.scrollWidth,
            scale: window.visualViewport?.scale ?? 1
          }));

          if (widthBeforeFocus.inner !== widthAfterFocus.inner || widthBeforeFocus.client !== widthAfterFocus.client) {
            throw new Error(`Input focus viewport genişliğini değiştirdi: ${JSON.stringify({ widthBeforeFocus, widthAfterFocus })}`);
          }

          await input.fill('25000');
          await page.waitForFunction(() => {
            const value = document.querySelector('#stat-avg-net')?.textContent || '';
            return value && !/^\s*0(?:[.,]00)?\s*₺?\s*$/.test(value);
          }, null, { timeout: 10000 });

          const result = await page.locator('#stat-avg-net').textContent();
          const emptyStateVisible = await page.locator('.human-empty-state').isVisible().catch(() => false);
          if (emptyStateVisible) throw new Error(`25.000 girişi sonrası empty state hâlâ görünür. Sonuç: ${result}`);
          if (consoleErrors.length) throw new Error(`Tarayıcı runtime hataları: ${consoleErrors.join(' | ')}`);

          console.log(`Canlı hesaplama doğrulandı. 25.000 brüt için sonuç: ${result}`);
          await browser.close();
          NODE
